# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Prepare local module dependencies
      run: |
        mkdir -p ../resource-ownership
        git clone --depth 1 https://github.com/replay-api/replay-common.git ../replay-common
        git clone --depth 1 https://github.com/resource-ownership/go-common.git ../resource-ownership/go-common
        git clone --depth 1 https://github.com/resource-ownership/go-mongodb.git ../resource-ownership/go-mongodb

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Build
      run: go build -v ./cmd/rest-api/main.go

    - name: Test Domain Layer
      run: go test -v ./pkg/domain/...

    - name: Test Application Layer
      run: go test -v ./pkg/app/...


