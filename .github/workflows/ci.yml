# =============================================================================
# Replay API - CI/CD Pipeline
# =============================================================================
# Go Backend for LeetGaming.PRO
# =============================================================================

name: Replay API CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      skip_integration:
        description: "Skip integration tests"
        type: boolean
        default: false
      skip_e2e:
        description: "Skip E2E tests"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "20"
  DOCKER_REGISTRY: ghcr.io
  DOCKER_NAMESPACE: replay-api

jobs:
  # ---------------------------------------------------------------------------
  # STAGE 1: Smoke Tests (Fast Feedback)
  # ---------------------------------------------------------------------------
  smoke-tests:
    name: 🔥 Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare local module dependencies
        run: |
          mkdir -p ../resource-ownership
          git clone --depth 1 https://github.com/replay-api/replay-common.git ../replay-common
          git clone --depth 1 https://github.com/resource-ownership/go-common.git ../resource-ownership/go-common
          git clone --depth 1 https://github.com/resource-ownership/go-mongodb.git ../resource-ownership/go-mongodb

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify build
        run: go build -v ./cmd/rest-api

      - name: Run smoke tests
        run: go test -v -short -tags=smoke ./... || true

  # ---------------------------------------------------------------------------
  # STAGE 2: Lint & Security
  # ---------------------------------------------------------------------------
  lint-security:
    name: 🔍 Lint & Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare local module dependencies
        run: |
          mkdir -p ../resource-ownership
          git clone --depth 1 https://github.com/replay-api/replay-common.git ../replay-common
          git clone --depth 1 https://github.com/resource-ownership/go-common.git ../resource-ownership/go-common
          git clone --depth 1 https://github.com/resource-ownership/go-mongodb.git ../resource-ownership/go-mongodb

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m
        continue-on-error: true

      - name: Run gosec security scanner
        uses: securego/gosec@master
        with:
          args: "-exclude=G104,G307,G115 -exclude-dir=pkg/infra/blob/_s3 -exclude-dir=test/blockchain ./..."
        continue-on-error: true

      - name: Check for vulnerabilities
        run: go list -json -deps ./... | docker run --rm -i sonatypecommunity/nancy:latest sleuth || true

  # ---------------------------------------------------------------------------
  # STAGE 3: Unit Tests
  # ---------------------------------------------------------------------------
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: [smoke-tests, lint-security]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare local module dependencies
        run: |
          mkdir -p ../resource-ownership
          git clone --depth 1 https://github.com/replay-api/replay-common.git ../replay-common
          git clone --depth 1 https://github.com/resource-ownership/go-common.git ../resource-ownership/go-common
          git clone --depth 1 https://github.com/resource-ownership/go-mongodb.git ../resource-ownership/go-mongodb

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run unit tests
        run: |
          go test -v -short -race -coverprofile=coverage-unit.out \
            ./pkg/domain/... \
            ./pkg/infra/...

      - name: Generate coverage report
        run: go tool cover -html=coverage-unit.out -o coverage.html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-unit.out
          flags: unittests
          name: api-unit-tests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage-unit.out
            coverage.html
          retention-days: 7

  # ---------------------------------------------------------------------------
  # STAGE 3.5: Blockchain Tests (Smart Contracts)
  # ---------------------------------------------------------------------------
  blockchain-tests:
    name: ⛓️ Blockchain Tests
    runs-on: ubuntu-latest
    needs: [smoke-tests, lint-security]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: test/blockchain/package-lock.json

      - name: Install dependencies
        working-directory: test/blockchain
        run: npm ci --silent

      - name: Compile smart contracts
        working-directory: test/blockchain
        run: npx hardhat compile

      - name: Run smart contract tests
        working-directory: test/blockchain
        run: npx hardhat test --parallel
        continue-on-error: true

      - name: Run smart contract coverage
        working-directory: test/blockchain
        run: npx hardhat coverage || true
        continue-on-error: true

      - name: Upload contract coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./test/blockchain/coverage/lcov.info
          flags: contracts
          name: smart-contract-tests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # STAGE 4: Integration Tests
  # ---------------------------------------------------------------------------
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, blockchain-tests]
    if: ${{ !inputs.skip_integration }}
    timeout-minutes: 25
    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: test123
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare local module dependencies
        run: |
          mkdir -p ../resource-ownership
          git clone --depth 1 https://github.com/replay-api/replay-common.git ../replay-common
          git clone --depth 1 https://github.com/resource-ownership/go-common.git ../resource-ownership/go-common
          git clone --depth 1 https://github.com/resource-ownership/go-mongodb.git ../resource-ownership/go-mongodb

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js (for Hardhat)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: test/blockchain/package-lock.json

      - name: Install Hardhat dependencies
        working-directory: test/blockchain
        run: npm ci --silent

      - name: Compile smart contracts
        working-directory: test/blockchain
        run: npx hardhat compile

      - name: Start Hardhat node
        working-directory: test/blockchain
        run: |
          npx hardhat node &
          sleep 10

      - name: Deploy contracts
        working-directory: test/blockchain
        run: npx hardhat run scripts/deploy.js --network localhost

      - name: Wait for MongoDB
        run: timeout 60 bash -c 'until nc -z localhost 27017; do sleep 2; done'

      - name: Run integration tests
        env:
          MONGO_TEST_URI: mongodb://test:test123@localhost:27017/replay_test?authSource=admin
          HARDHAT_RPC_URL: http://localhost:8545
        run: |
          go test -v -race -coverprofile=coverage-integration.out \
            -tags=integration \
            -timeout=15m \
            ./test/integration/...
        continue-on-error: true

      - name: Upload integration coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-integration.out
          flags: integration
          name: api-integration-tests
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # STAGE 5: E2E Tests
  # ---------------------------------------------------------------------------
  e2e-tests:
    name: 🎯 E2E Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: ${{ !inputs.skip_e2e }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare local module dependencies
        run: |
          mkdir -p ../resource-ownership
          git clone --depth 1 https://github.com/replay-api/replay-common.git ../replay-common
          git clone --depth 1 https://github.com/resource-ownership/go-common.git ../resource-ownership/go-common
          git clone --depth 1 https://github.com/resource-ownership/go-mongodb.git ../resource-ownership/go-mongodb

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start test infrastructure
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for services
        run: |
          timeout 120 bash -c 'until nc -z localhost 27018; do sleep 2; done'
          timeout 120 bash -c 'until curl -sf http://localhost:8545 > /dev/null 2>&1; do sleep 2; done'
          sleep 15

      - name: Run E2E tests
        env:
          MONGO_TEST_URI: mongodb://test:test123@localhost:27018/replay_test?authSource=admin
          HARDHAT_RPC_URL: http://localhost:8545
        run: |
          go test -v -race -coverprofile=coverage-e2e.out \
            -tags=e2e \
            -timeout=20m \
            ./test/integration/...
        continue-on-error: true

      - name: Upload E2E coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-e2e.out
          flags: e2e
          name: api-e2e-tests
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # ---------------------------------------------------------------------------
  # STAGE 6: Build & Push Docker Image
  # ---------------------------------------------------------------------------
  docker:
    name: 🐳 Build & Push Docker
    runs-on: ubuntu-latest
    needs: [unit-tests, blockchain-tests, integration-tests, e2e-tests]
    if: |
      always() &&
      github.ref == 'refs/heads/main' && 
      github.event_name == 'push' &&
      needs.unit-tests.result == 'success'
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}/replay-api
            leetgaming/replay-api
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}

  # ---------------------------------------------------------------------------
  # STAGE 7: Benchmarks (PR only)
  # ---------------------------------------------------------------------------
  benchmarks:
    name: 📈 Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: unit-tests
    permissions:
      pull-requests: write
    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: test123
        ports:
          - 27017:27017
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare local module dependencies
        run: |
          mkdir -p ../resource-ownership
          git clone --depth 1 https://github.com/replay-api/replay-common.git ../replay-common
          git clone --depth 1 https://github.com/resource-ownership/go-common.git ../resource-ownership/go-common
          git clone --depth 1 https://github.com/resource-ownership/go-mongodb.git ../resource-ownership/go-mongodb

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run benchmarks
        env:
          MONGO_TEST_URI: mongodb://test:test123@localhost:27017/replay_test?authSource=admin
        run: |
          go test -bench=. -benchmem -count=3 \
            -timeout=10m \
            ./test/integration/... | tee benchmark.txt

      - name: Comment PR with benchmarks
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const benchmark = fs.readFileSync('benchmark.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📈 Benchmark Results\n\`\`\`\n${benchmark}\n\`\`\``
            })

  # ---------------------------------------------------------------------------
  # STAGE 8: Notify ESAP
  # ---------------------------------------------------------------------------
  notify-esap:
    name: 📢 Notify ESAP
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - name: Trigger ESAP workflow
        if: env.GH_PAT != ''
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ env.GH_PAT }}
          repository: leetgaming-pro/esap
          event-type: backend-updated
          client-payload: |
            {
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "repository": "${{ github.repository }}"
            }

      - name: Skip ESAP notification
        if: env.GH_PAT == ''
        run: echo "Skipping ESAP notification because GH_PAT is not configured."

  # ---------------------------------------------------------------------------
  # Summary
  # ---------------------------------------------------------------------------
  summary:
    name: 📊 Pipeline Summary
    runs-on: ubuntu-latest
    needs:
      [smoke-tests, lint-security, unit-tests, blockchain-tests, integration-tests, e2e-tests]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## 🎮 Replay API Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests | ${{ needs.smoke-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Security | ${{ needs.lint-security.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Blockchain Tests | ${{ needs.blockchain-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result == 'success' && '✅' || needs.integration-tests.result == 'skipped' && '⏭️' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result == 'success' && '✅' || needs.e2e-tests.result == 'skipped' && '⏭️' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
